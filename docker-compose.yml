# Whole stack on http://localhost:8080. Owner: P4.
# Every service: Dockerfile at its folder root, GET /health returns 200.

x-py-health: &py-health
  interval: 5s
  timeout: 3s
  retries: 20

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      mcp: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: tta-api
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  mcp:
    build: { context: ., dockerfile: services/mcp/Dockerfile }
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: tta-mcp
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:   # inlined into the browser bundle at build time; rebuild after changing them
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_LANGFUSE_PROJECT_URL: ${NEXT_PUBLIC_LANGFUSE_PROJECT_URL:-}
    env_file: .env

  grafana:   # Valio Aimo side: audit dashboard on http://localhost:3001, not behind the buyer app's nginx
    image: grafana/grafana-oss:11.5.2
    ports: ["3001:3000"]
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway-audit.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

  import:
    build: { context: ., dockerfile: services/mcp/Dockerfile }
    env_file: .env
    volumes: ["./data:/repo/data:ro", "./scripts:/repo/scripts:ro"]
    command: ["python", "/repo/scripts/import/run.py"]
    profiles: ["tools"]  # docker compose run --rm import

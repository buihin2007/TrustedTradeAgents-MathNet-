[project]
name = "tta-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=4.2,<5",
  "tta-contracts",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "sqlglot>=25",
  "PyJWT[crypto]>=2",
  "opentelemetry-exporter-otlp-proto-http>=1",
  "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11"]

[tool.uv.sources]
tta-contracts = { path = "../../packages/contracts", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

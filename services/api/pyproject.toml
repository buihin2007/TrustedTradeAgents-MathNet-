[project]
name = "tta-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "tta-contracts",
  "fastmcp>=3,<5",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "supabase>=2.27,<3",
  "psycopg-pool>=3.2,<4",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".test-cache"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["database: requires a disposable local TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
tta-contracts = { path = "../../packages/contracts", editable = true }

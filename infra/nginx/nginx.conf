# Owner: P4. Single entry point: / -> web, /api/ -> api, /mcp -> mcp.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_zone $http_authorization zone=per_key:10m rate=5r/s;
limit_req_status 429;

server {
  listen 80;

  # Docker DNS + variables: nginx starts even if an upstream is not up yet (502 instead of crash).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $web http://web:3000;
  set $api http://api:8000;
  set $mcp http://mcp:9000;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    proxy_pass $web;
  }

  location /api/ {
    limit_req zone=per_ip burst=40 nodelay;
    proxy_pass $api;
    # /api/requests/{id}/stream is server-sent events: no buffering, long-lived connection
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Valio Aimo's public key for quote signatures (docs/AGENT_INTEGRATION.md)
  location /.well-known/ {
    limit_req zone=per_ip burst=40 nodelay;
    proxy_pass $mcp;
  }

  # /mcp and /mcp/... (no trailing-slash redirect)
  location /mcp {
    limit_req zone=per_key burst=10 nodelay;
    limit_req zone=per_ip burst=40 nodelay;
    proxy_pass $mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
